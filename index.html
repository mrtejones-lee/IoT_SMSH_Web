<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101513">
  <title>Minewatch | Safety Monitoring</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="#overview" aria-label="Minewatch overview">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>Minewatch<small>Helmet monitoring</small></span>
      </a>
      <div class="top-meta">
        <time id="clock" aria-label="Current date and time"></time>
        <span class="demo-pill">DEMO MODE · SIMULATED SENSOR DATA</span>
        <span class="connection"><i class="dot"></i><span id="connection-text">Device online</span></span>
        <div class="profile"><span class="avatar">R</span><span>Research console</span></div>
      </div>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="Main navigation">
        <p class="side-label">Workspace</p>
        <nav class="nav" id="nav">
          <a href="#overview" data-route="overview"><span class="nav-icon">+</span>Overview</a>
          <a href="#monitoring" data-route="monitoring"><span class="nav-icon">~</span>Live monitoring</a>
          <a href="#devices" data-route="devices"><span class="nav-icon">[]</span>Helmet devices</a>
          <a href="#miners" data-route="miners"><span class="nav-icon">o</span>Miners</a>
          <a href="#alerts" data-route="alerts"><span class="nav-icon">!</span>Alerts <span class="nav-count" id="nav-alert-count"></span></a>
          <a href="#history" data-route="history"><span class="nav-icon">=</span>Historical data</a>
        </nav>
        <p class="side-note">Research prototype. Readings are simulated for demonstration and are not certified safety measurements.</p>
      </aside>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <script src="mockSensorEngine.js"></script>
  <script src="app.js"></script>
</body>
</html>
